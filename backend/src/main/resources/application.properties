# Default local profile: H2 in-memory database for development/test runs.
# For MySQL, override these values with environment variables or a profile-specific file.
# Example: DB_URL=jdbc:mysql://localhost:3306/it_helpdesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:h2:mem:it_helpdesk;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET:QmFzZTY0U2VjcmV0S2V5Zm9ySXRIZWxwZGVzaw==}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html
